plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {

    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
    testImplementation 'net.masterthought:cucumber-reporting:5.7.7'
}

test {

    useJUnitPlatform()
    systemProperty "karate.env", System.getProperty("karate.env")
}